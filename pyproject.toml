[project]
name = "gridworks-ear"
version = "0.0.1"
description = "Gridworks Ear"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "GridWorks", email = "gridworks@gridworks-consulting.com" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
]
# Pins are FAITHFUL translations of the poetry carets — the actor code is
# written against this gridworks-base era; upgrades are a separate,
# deliberate change (OPS-458's one rule).
dependencies = [
    "boto3>=1.26.37,<2",
    "slack-sdk>=3.19.5,<4",
    "pendulum>=3.0.0,<4",
    "gridworks>=1.4.1,<2",
    "typer>=0.12.3,<0.13",
    "xdg>=6.0.0,<7",
    "boto3-stubs[s3]>=1.34.158,<2",
    "gridworks-base>=0.2.4,<0.3",
]

[project.urls]
homepage = "https://github.com/thegridelectric/gridworks-ear"
repository = "https://github.com/thegridelectric/gridworks-ear"
documentation = "https://gridworks-ear.readthedocs.io"
Changelog = "https://github.com/thegridelectric/gridworks-ear/releases"

[project.scripts]
ear = "gear.__main__:app"

[dependency-groups]
dev = [
    "Pygments>=2.10.0",
    "coverage[toml]>=6.2",
    "furo>=2021.11.12",
    "mypy>=0.930",
    "pep8-naming>=0.12.1",
    "pre-commit>=2.16.0",
    "pre-commit-hooks>=4.1.0",
    "pytest>=6.2.5",
    "pyupgrade>=2.29.1",
    "sphinx>=4.3.2",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-click>=3.0.2",
    "xdoctest[colors]>=0.15.10",
    "myst-parser>=0.16.1",
    "pika-stubs>=0.1.3,<0.2",
    "ruff>=0.5.6,<0.6",
    "rich>=13.7.1,<14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gear"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["gear", "tests"]

[tool.coverage.report]
show_missing = false
fail_under = 15

[tool.isort]
profile = "black"
force_single_line = true
lines_after_imports = 2

[tool.mypy]
strict = true
warn_unreachable = true
pretty = false
show_column_numbers = true
show_error_codes = true
show_error_context = false

[tool.ruff]
exclude = [
    ".ci",
    ".github",
    "for_docker",
    "docs",
    ".git",
    ".mypy_cache",
    ".nox",
    "htmlcov",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "pythonProject",
    ".idea",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
]
output-format = "concise"
fix = true
show-fixes = true

[tool.ruff.format]
preview = false

[tool.ruff.lint]
# default select used by  ruff: ["E4", "E7", "E9", "F"]
# select = ["B","C90","E4", "E7", "E9","F","I","N","PL", "W",]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY",
    "D",
    "DOC",
    "E501",
    "FA102",
    "ISC001",
    "PLR0904",
    "PLW1514",
    "TCH",
    "W191",
    "W293",
]
preview = false

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101", # asserts allowed in tests
    "T201", # print allowed in tests
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
#    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
#    # The below are debateable
#    "PLR2004", # Magic value used in comparison, ...
#    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
]
