name: Tests

on:
  - push
  - pull_request

jobs:
  pre-commit:
    name: pre-commit / 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

  tests:
    name: tests / 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start World Broker
        uses: namoshek/rabbitmq-github-action@v1
        with:
          version: "3.9.13"
          ports: "1885:1885 4369:4369 5672:5672 15672:15672 15674:15674 25672:25672"
          config: ${{ github.workspace }}/.ci/rabbitmq.conf
          container-name: "rabbit"

      - uses: astral-sh/setup-uv@v7
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Run the suite
        run: uv run pytest -q
